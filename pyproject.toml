[project]
name = "qpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "codeHariharan", email = "hariharan120208@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torchvision>=0.29.1",
]

[project.scripts]
qpilot = "qpilot:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
